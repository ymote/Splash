[package]
name = "octoscript-ui-l0"
version = "0.1.0"
edition = "2021"
description = "UI Profile Level 0: check, realize and dispatch LLM-authored Octoscript cards"
license = "MIT OR Apache-2.0"

# serde_json and nothing else — deliberately.
#
# L0 has no expression form, so there is nothing to evaluate and no VM in the
# path. Keeping the dependency list at one crate is what makes that claim
# checkable rather than asserted, and what lets a host adopt L0 without adopting
# a runtime: `octoscript-core` depends on a vendored makepad-script, and any app
# already carrying a different makepad lineage cannot depend on it at all —
# Cargo rejects the lockfile, because both ship `makepad-error-log v1.0.0` at
# different paths. That collision is the reason this crate exists.
[dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"
