[package]
name = "octoscript-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-owned planning and execution for Octoscript workflows"

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.5", features = ["pure"] }
getrandom = { version = "0.3.4", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
octoscript-capabilities = { path = "../octoscript-capabilities" }
octoscript-core = { path = "../octoscript-core" }
octoscript-protocol = { version = "0.1.0", path = "../octoscript-protocol" }
octoscript-sandbox = { version = "0.1.0", path = "../octoscript-sandbox", optional = true }
octoscript-schema = { version = "0.1.0", path = "../octoscript-schema" }
octoscript-storage = { version = "0.1.0", path = "../octoscript-storage" }

[features]
http-endpoint-catalog = ["octoscript-capabilities/http-endpoint-catalog"]
platform-keyring-secret-resolver = [
    "http-endpoint-catalog",
    "octoscript-capabilities/platform-keyring-secret-resolver",
]
multiplexed-worker = ["octoscript-capabilities/json-line-worker"]
bubblewrap-recovery = [
    "dep:getrandom",
    "dep:octoscript-sandbox",
    "multiplexed-worker",
]
