[package]
name = "octoscript-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line runner for Octoscript scripts"

[lints]
workspace = true

[[bin]]
name = "octoscript"
path = "src/main.rs"

[dependencies]
octoscript-capabilities = { path = "../octoscript-capabilities" }
octoscript-core = { path = "../octoscript-core" }
octoscript-workflow = { version = "0.1.0", path = "../octoscript-workflow" }

[dev-dependencies]
serde_json = "1.0.150"
