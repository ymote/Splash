[package]
name = "octoscript-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-scoped worker runtime for Octoscript Rust adapters"

[lints]
workspace = true

[features]
sqlite = ["octoscript-storage/sqlite"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
octoscript-protocol = { version = "0.1.0", path = "../octoscript-protocol" }
octoscript-storage = { version = "0.1.0", path = "../octoscript-storage" }
zeroize = "1.8.2"
