[package]
name = "octoscript-capabilities"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-gated tool host for Octoscript"

[lints]
workspace = true

[dependencies]
blake3 = { version = "1.8.5", features = ["pure"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"], optional = true }
makepad-script = { path = "../../vendor/makepad/platform/script" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
octoscript-core = { path = "../octoscript-core" }
octoscript-protocol = { version = "0.1.0", path = "../octoscript-protocol" }
octoscript-sandbox = { version = "0.1.0", path = "../octoscript-sandbox", optional = true }
octoscript-schema = { version = "0.1.0", path = "../octoscript-schema" }
octoscript-storage = { version = "0.1.0", path = "../octoscript-storage", optional = true }
octoscript-worker = { version = "0.1.0", path = "../octoscript-worker", optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"], optional = true }
zeroize = { version = "1.9.0", optional = true }

[features]
bubblewrap-watchdog = ["dep:octoscript-sandbox"]
in-process-worker = ["dep:octoscript-worker"]
json-line-worker = []
http-endpoint-catalog = ["dep:ureq", "dep:zeroize"]
linux-network-broker = ["http-endpoint-catalog", "dep:octoscript-sandbox"]
platform-keyring-secret-resolver = ["http-endpoint-catalog", "dep:keyring"]
platform-keyring-worker-secret-provider = ["dep:keyring", "dep:octoscript-worker"]
durable-audit-journal = ["dep:octoscript-storage"]
